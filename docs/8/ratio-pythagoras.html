<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>יחס ופיתגורס · כיתה ח׳</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mute:#6b7280;--acc:#4f46e5;--acc2:#eef2ff;--ok:#15803d;--okbg:#ecfdf5;--bad:#b91c1c;--badbg:#fef2f2;--hint:#92400e;--hintbg:#fffbeb;--line:#e5e7eb;--rem:#7c3aed;--rembg:#f5f3ff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:10px 14px 50px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-weight:700;line-height:1.15;margin:0 3px;direction:ltr}
.fr i{font-style:normal;padding:0 4px}.fr i:first-child{border-bottom:2px solid currentColor}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
header h1{font-size:21px;margin:0}
.ib{min-width:48px;min-height:48px;border:0;background:var(--card);border-radius:12px;padding:8px 11px;font-size:18px;box-shadow:0 1px 3px #0001;cursor:pointer}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px #0000000d;margin:12px 0;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:19px;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff;font-weight:600;margin-top:10px}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.rem{background:var(--rem)}
.btn:active{transform:scale(.98)}
.lvl{display:flex;align-items:center;gap:12px;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:400}
.lvl .e{font-size:22px;min-width:78px;text-align:center;white-space:nowrap;letter-spacing:-2px}
.lvl b{display:block;font-size:19px}
.lvl small{color:var(--mute);font-size:15px}
.lvl .sc{margin-inline-start:auto;font-weight:700;color:var(--acc);white-space:nowrap}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:16px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(270deg,#818cf8,#4f46e5);border-radius:9px;transition:width .4s}
.qt{font-size:20px;font-weight:600}
.opts{display:grid;gap:9px;margin-top:12px}
.op{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-size:18px;font-family:inherit;text-align:right;cursor:pointer;color:var(--ink)}
.op:disabled{opacity:.45}
.op.good{border-color:var(--ok);background:var(--okbg);opacity:1}
.op.wrong{border-color:var(--bad);background:var(--badbg);animation:sh .3s}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.num{display:flex;gap:8px;margin-top:12px}
.num input,.rat input{min-height:52px;font-size:22px;padding:10px;border:2px solid var(--line);border-radius:14px;text-align:center;font-family:inherit;direction:ltr;min-width:0}
.num input{flex:1}
.num .btn{width:auto;margin:0;padding:0 22px}
.rat{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:12px;direction:ltr}
.rat label{display:flex;flex-direction:column;align-items:center;font-size:15px;color:var(--mute);width:120px}
.rat input{width:100%}
.rat b{font-size:30px;padding-bottom:6px}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;animation:up .3s}
.fb.ok{background:var(--okbg);color:#064e3b}
.fb.hi{background:var(--hintbg);color:var(--hint)}
.fb.no{background:var(--badbg);color:#7f1d1d}
.diag{background:var(--rembg);border-inline-start:4px solid var(--rem);border-radius:10px;padding:8px 12px;margin-top:10px;color:#4c1d95;font-size:17px}
.remb{background:var(--rembg);color:var(--rem);border-radius:12px;padding:6px 12px;font-size:16px;font-weight:600;margin-bottom:6px}
.steps div{opacity:0;animation:up .4s forwards;padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;color:var(--ink)}
.steps small{color:#15803d;font-size:15px;text-align:left;white-space:nowrap}
.fig{width:100%;max-width:330px;max-height:230px;display:block;margin:8px auto 0;direction:ltr}
.fig .pl{fill:#eef2ff;stroke:#334155;stroke-width:2.6;stroke-linejoin:round}
.fig .ln{stroke:#334155;stroke-width:2.6;stroke-linecap:round;fill:none}
.fig .wall{stroke:#78716c;stroke-width:7}
.fig .dash{stroke:#0891b2;stroke-width:2.4;stroke-dasharray:7 5;fill:none}
.fig .ra{fill:none;stroke:#e11d48;stroke-width:2}
.fig text{font-family:Arial,sans-serif;text-anchor:middle;dominant-baseline:middle;font-weight:700;font-size:17px;fill:#0f766e}
.fig text.q{fill:#e11d48;font-size:20px}
.fig text.w{fill:#57534e;font-size:15px;font-weight:600}
.fig .pl,.fig .ln{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 1s ease forwards}
.fig text,.fig .ra,.fig .dash,.fig circle{opacity:0;animation:fd .4s .6s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fd{to{opacity:1}}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--acc);width:22px}
.nav{display:flex;gap:8px}.nav .btn{flex:1;padding:13px 6px;font-size:17px}
.big{font-size:56px;font-weight:800;text-align:center;color:var(--acc);line-height:1.1}
.stars{text-align:center;font-size:34px;letter-spacing:4px}
.center{text-align:center}
.box{background:var(--acc2);border-radius:12px;padding:10px 12px;margin:8px 0}
.warn{background:var(--badbg);border-radius:12px;padding:10px 12px;margin:8px 0;color:#7f1d1d}
.rv{opacity:0;animation:up .5s forwards}
table{width:100%;border-collapse:collapse;font-size:17px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.name{width:100%;font-size:19px;padding:10px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.burst span{position:absolute;top:-30px;font-size:26px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(300deg);opacity:.2}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:10px 16px;font-size:16px;z-index:10;animation:up .3s}
footer{text-align:center;color:var(--mute);font-size:14px;margin-top:20px}
.c1{color:#dc2626;font-weight:700}.c2{color:#2563eb;font-weight:700}
.rat label:first-child span{color:#dc2626;font-weight:700}.rat label:last-child span{color:#2563eb;font-weight:700}
.rat label:first-child input{border-color:#fca5a5}.rat label:last-child input{border-color:#93c5fd}
.fig g.gp{opacity:0;animation:fd .45s forwards}
.hb{display:flex;gap:8px;margin-top:10px}.hb .btn{margin:0;padding:10px 6px;font-size:16px}
.help{background:#fffbeb;border:2px solid #fde68a;border-radius:14px;padding:10px 12px;margin-top:10px}
.ht{font-weight:700;color:#92400e;margin-bottom:4px}
.hs{padding:7px 0;border-bottom:1px dashed #fde68a}.hs.new{animation:up .4s}
.code div{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.code .ce{font-size:24px;min-width:32px}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>⚖️ יחס · 📐 פיתגורס</h1><div style="font-size:14px;color:var(--mute)">שחקים · ערכה: רוני מודן</div></div><div><button class="ib" onclick="home()" title="בית">🏠</button> <button class="ib" onclick="fs()" title="מסך מלא">⛶</button></div></header>
<main id="app"></main>
<footer>ערכה: רוני מודן · שחקים · כיתה ח׳</footer>
</div>
<div class="burst" id="burst"></div>
<script>
// ================= כלים =================
const $=s=>document.querySelector(s);
const app=()=>({set innerHTML(h){$('#app').innerHTML=h.replace(/(ניצב|יתר)²/g,'<span class="m">$1²</span>')}});
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const M=s=>`<span class="m">${s}</span>`;
const RT=(a,b)=>M(a+' : '+b);
const fr=(a,b)=>`<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const sq=n=>n+'²';
function cop(lo,hi,dist=true){let a,b;do{a=ri(lo,hi);b=ri(lo,hi)}while(gcd(a,b)!==1||(dist&&a===b)||(a===1&&b===1));return[a,b]}
// בחירה מרובה: right = html, wrongs = [[html,msg],...]
function mc(right,wrongs){const all=[{h:right,r:1}];wrongs.forEach(w=>{if(!all.some(x=>x.h===w[0]))all.push({h:w[0],m:w[1]})});const o=shuffle(all);return{kind:'mc',opts:o.map(x=>x.h),msgs:o.map(x=>x.m||null),ans:o.findIndex(x=>x.r)}}
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function burst(){const b=$('#burst');for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=pick(['⭐','🎉','✨','💜','🏆']);s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.6+'s';b.appendChild(s);setTimeout(()=>s.remove(),2600)}}
// ---- שמירת התקדמות (רק במכשיר של התלמיד) ----
let DB={name:'',best:{}};
try{const s=localStorage.getItem('rm_ratio_pyth_v2');if(s)DB=Object.assign(DB,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem('rm_ratio_pyth_v2',JSON.stringify(DB))}catch(e){}}
function share(){const u=location.href.split('#')[0];if(navigator.share){navigator.share({title:'יחס ופיתגורס – תרגול',url:u}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>toast('הקישור הועתק ✔'),()=>prompt('העתיקו את הקישור:',u))}else prompt('העתיקו את הקישור:',u)}

// ================= שרטוטים =================
// משולש ישר זווית: ניצב אופקי (h), ניצב אנכי (v), יתר (c). flip = הזווית הישרה משמאל
function tri(a,b,L,o={}){
 const s=Math.min(190/a,140/b);let w=Math.max(70,a*s),h=Math.max(60,b*s);
 const flip=!!o.flip,cy=185,cx=flip?60:250,ax=flip?cx+w:cx-w,by=cy-h;
 const d=flip?1:-1;let g='';
 if(o.wall){g+=`<line class="ln" x1="${flip?10:290}" y1="${cy}" x2="${ax+d*-30}" y2="${cy}"/><line class="wall" x1="${cx+(flip?-4:4)}" y1="${cy}" x2="${cx+(flip?-4:4)}" y2="${by-14}"/>`}
 g+=`<polygon class="pl" points="${cx},${cy} ${ax},${cy} ${cx},${by}"/>`;
 g+=`<path class="ra" d="M${cx+d*14},${cy} L${cx+d*14},${cy-14} L${cx},${cy-14}"/>`;
 const T=(x,y,t)=>t===undefined||t===''?'':`<text x="${x}" y="${y}" class="${t==='?'?'q':''}">${t}</text>`;
 g+=T((cx+ax)/2,cy+16,L.h);
 g+=T(cx-d*24,(cy+by)/2,L.v);
 const mx=(ax+cx)/2,my=(cy+by)/2,nx=-(by-cy),ny=(cx-ax);const nl=Math.hypot(nx,ny);let ux=nx/nl,uy=ny/nl;if(uy>0){ux=-ux;uy=-uy}
 g+=T(mx+ux*20,my+uy*20,L.c);
 if(o.words)o.words.forEach(t=>g+=`<text class="w" x="${t[0]}" y="${t[1]}">${t[2]}</text>`);
 return `<svg class="fig" viewBox="0 0 310 210">${g}</svg>`}
function rect(L,o={}){let g=`<rect class="pl" x="40" y="35" width="230" height="130" rx="2"/>`;
 if(o.diag)g+=`<line class="dash" x1="40" y1="165" x2="270" y2="35"/>`;
 const T=(x,y,t)=>t===undefined?'':`<text x="${x}" y="${y}" class="${t==='?'?'q':''}">${t}</text>`;
 g+=T(155,185,L.w)+T(18,100,L.h);if(o.diag)g+=T(138,80,L.d);
 return `<svg class="fig" viewBox="0 0 310 200">${g}</svg>`}
function iso(L){let g=`<polygon class="pl" points="155,30 40,180 270,180"/><line class="dash" x1="155" y1="30" x2="155" y2="180"/><path class="ra" d="M155,166 L169,166 L169,180"/>`;
 g+=`<text x="85" y="98">${L.c}</text><text x="${225}" y="98">${L.c}</text><text x="155" y="197">${L.base}</text><text x="140" y="120" class="q">${L.hgt}</text>`;
 return `<svg class="fig" viewBox="0 0 310 205">${g}</svg>`}
function walk(a,b){const s=Math.min(200/a,130/b);const w=Math.max(80,a*s),h=Math.max(60,b*s);const x0=40,y0=180;
 let g=`<polyline class="ln" points="${x0},${y0} ${x0+w},${y0} ${x0+w},${y0-h}"/><line class="dash" x1="${x0}" y1="${y0}" x2="${x0+w}" y2="${y0-h}"/>`;
 g+=`<circle cx="${x0}" cy="${y0}" r="6" fill="#16a34a"/><circle cx="${x0+w}" cy="${y0-h}" r="6" fill="#e11d48"/>`;
 g+=`<text x="${x0+w/2}" y="${y0+16}">${a}</text><text x="${x0+w+22}" y="${y0-h/2}">${b}</text><text x="${x0+w/2-14}" y="${y0-h/2-14}" class="q">?</text>`;
 g+=`<text class="w" x="${x0}" y="${y0+18}">התחלה</text>`;
 return `<svg class="fig" viewBox="0 0 310 205">${g}</svg>`}
function dots(a,b,c1='#e11d48',c2='#2563eb'){let g='';const r=11,sp=28;
 const row=(n,y,c)=>{for(let i=0;i<n;i++)g+=`<circle cx="${30+i*sp}" cy="${y}" r="${r}" fill="${c}"/>`};
 row(a,30,c1);row(b,75,c2);return `<svg class="fig" viewBox="0 0 ${Math.max(a,b)*sp+30} 105" style="max-height:110px">${g}</svg>`}

// ================= מחוללי שאלות: יחס =================
const c1=x=>`<span class="c1">${x}</span>`,c2=x=>`<span class="c2">${x}</span>`;
const RC=(a,b)=>`<span class="m"><span class="c1">${a}</span> : <span class="c2">${b}</span></span>`;
const RATIO={
r_write(){const c=pick([['בנים','בנות',(a,b)=>`בכיתה יש ${c1(a+' בנים')} ו־${c2(b+' בנות')}.`],['כדורים אדומים','כדורים כחולים',(a,b)=>`בקופסה יש ${c1(a+' כדורים אדומים')} ו־${c2(b+' כדורים כחולים')}.`],['עפרונות','עטים',(a,b)=>`בקלמר יש ${c1(a+' עפרונות')} ו־${c2(b+' עטים')}.`]]);
 let a=ri(2,9),b=ri(2,9);while(a===b)b=ri(2,9);const g=gcd(a,b);
 const sol=[[`${c1(c[0])}: ${M(a)} · ${c2(c[1])}: ${M(b)}`,'סופרים כל קבוצה'],[`היחס: ${RC(a,b)}`,'לפי הסדר שבשאלה']];if(g>1)sol.push([`אפשר לצמצם: ${RC(a/g,b/g)}`,`חילקנו את שניהם ב־${M(g)}`]);
 return{kind:'ratio',labels:[c[0],c[1]],ans:[a,b],exact:false,A:c[0],B:c[1],known:`${c1(a+' '+c[0])}, ${c2(b+' '+c[1])}`,ask:'מה היחס',
 txt:c[2](a,b)+` מה היחס בין ${c1(c[0])} ל${c2(c[1])}?`,fig:c[0]==='כדורים אדומים'?dots(a,b):'',
 hint:`היחס נכתב לפי הסדר שבשאלה: קודם ${c1(c[0])}, אחר כך ${c2(c[1])}.`,
 err:(x,y)=>x*a===y*b&&a!==b?`הפכתם את הסדר! בשאלה נאמר קודם ${c1(c[0])} – לכן הם ראשונים ביחס.`:null,
 sol,diag:'לכתוב יחס לפי הסדר שבשאלה – מה שנאמר ראשון נכתב ראשון.'}},
r_equiv(){const[a,b]=cop(1,6),k=ri(2,5);
 return Object.assign(mc(RC(k*a,k*b),[[RC(a+k,b+k),`הוספתם ${M(k)} לשני המספרים. ביחס לא מוסיפים – כופלים את שניהם באותו מספר.`],[RC(k*a,b),'כפלתם רק מספר אחד. צריך לכפול את שניהם באותו מספר.'],[RC(k*b,k*a),'הסדר התהפך! שימו לב מי ראשון.']]),{
 txt:`איזה יחס שווה ל־${RC(a,b)}?`,hint:'יחס שווה מקבלים כשכופלים את שני המספרים באותו מספר.',grp:[a,b,k],
 dec:['🔍 יחס שווה = אותו יחס, רק עם יותר קבוצות',`✍️ בודקים כל תשובה: האם ${c1('הראשון')} ו${c2('השני')} גדלו פי <b>אותו</b> מספר?`,'⚠️ אם הוסיפו מספר – זה לא יחס שווה'],
 sol:[[`${RC(a,b)} ← ${RC(k*a,k*b)}`,`כפלנו את שניהם ב־${M(k)}`]],diag:'הרחבת יחס: כופלים את שני המספרים באותו מספר – לא מוסיפים.'})},
r_expand(){const[a,b]=cop(1,7),k=ri(2,6);
 return{kind:'num',ans:k*b,txt:`השלימו את המספר החסר: ${RC(a,b)} = ${RC(k*a,'?')}`,grp:[a,b,k],
 dec:[`🔍 ${c1(a)} הפך ל־${c1(k*a)}. פי כמה הוא גדל?`,`📦 כלומר: כמה קבוצות של ${RC(a,b)} יש כאן?`,`✍️ גם ${c2(b)} גדל פי אותו מספר`],
 hint:`בכמה כפלו את ${c1(a)} כדי לקבל ${c1(k*a)}? כפלו גם את ${c2(b)} באותו מספר.`,
 err:x=>x===b+(k*a-a)?`הוספתם ${M(k*a-a)} במקום לכפול. ${c1(a)} הפך ל־${c1(k*a)} כי כפלנו ב־${M(k)}.`:null,
 sol:[[M(`${a} · ${k} = ${k*a}`),`פי ${M(k)} = ${M(k)} קבוצות`],[M(`${b} · ${k} = ${k*b}`),'גם השני פי '+M(k)]],diag:'למצוא "פי כמה" (כמה קבוצות) – ולכפול גם את השני באותו מספר.'}},
r_reduce(){const[a,b]=cop(1,9),g=ri(2,9);
 return{kind:'ratio',labels:['',''],ans:[a,b],exact:true,txt:`צמצמו את היחס ${RC(a*g,b*g)} עד הסוף.`,grp:[a,b,g],
 dec:['🔍 צמצום = מחלקים את שני המספרים באותו מספר',`✍️ מחפשים מספר שמחלק גם את ${c1(a*g)} וגם את ${c2(b*g)}`,'💡 מנסים: 2, 3, 5... אפשר לצמצם כמה פעמים','✔ עוצרים כשאין מספר שמחלק את שניהם'],
 hint:`חפשו מספר שמחלק גם את ${c1(a*g)} וגם את ${c2(b*g)}. אפשר לצמצם כמה פעמים.`,
 sol:[[`מספר שמחלק את שניהם: ${M(g)}`,'גורם משותף'],[M(`${a*g} : ${g} = ${a}`)+' , '+M(`${b*g} : ${g} = ${b}`),'מחלקים את שניהם'],[`היחס המצומצם: ${RC(a,b)}`,'אין עוד מספר שמחלק את שניהם']],

 txt:`נועה חישבה את היתר במשולש ישר זווית שהניצבים שלו ${M(a)} ו־${M(b)}: "${M(a+' + '+b+' = '+(a+b))}, לכן היתר הוא ${M(a+b)}". מה הטעות שלה?`,

p_short(){const[a,b,c]=tr();

function startLevel(t,l,go){if(!go)return lesson(t,l,0);const ids=TOP[t].L[l];let seq=[];while(seq.length<PER)seq=seq.concat(shuffle(ids));seq=seq.slice(0,PER);
 S={t,l,n:0,score:0,seq,rem:null};nextQ()}
function nextQ(){if(S.rem&&S.rem.need>0){if(S.rem.count>=5&&!S.rem.asked)return stuck();S.rem.count++;show(gen(S.t,S.rem.id,S.l,Q&&Q.txt));return}
 if(S.rem&&S.rem.need<=0){S.rem=null;toast('💪 הבנת! ממשיכים במסלול');burst()}
 if(S.n>=PER)return levelEnd();show(gen(S.t,S.seq[S.n],S.l,Q&&Q.txt))}
function stuck(){S.rem.asked=true;app().innerHTML=`<div class="card"><div class="qt">🤝 הנושא הזה עוד קצת קשה – וזה בסדר!</div><div class="diag">🔎 מה כדאי לחזק: ${S.lastDiag||''}</div>
 <div style="margin-top:8px">אפשר לחזור לתזכורת, לבקש עזרה מהמורה, או לנסות עוד שאלה דומה.</div>
 <button class="btn rem" onclick="nextQ()">עוד שאלה דומה 💪</button><button class="btn sec" onclick="recap('${S.t}',0)">🎬 לתזכורת</button><button class="btn sec" onclick="S.rem=null;nextQ()">להמשיך הלאה</button></div>`}
let Q=null,tries=0,done=false;
function inputHTML(q,dis=''){if(q.kind==='mc')return`<div class="opts">${q.opts.map((o,i)=>`<button class="op" id="o${i}" onclick="answer(${i})">${o}</button>`).join('')}</div>`;
 if(q.kind==='ratio')return`<div class="rat"><label><span>${q.labels[0]||'&nbsp;'}</span><input id="a1" inputmode="numeric"></label><b>:</b><label><span>${q.labels[1]||'&nbsp;'}</span><input id="a2" inputmode="numeric"></label></div><button class="btn" id="go" onclick="answer()">בדיקה</button>`;
 return`<div class="num"><input id="a1" inputmode="decimal" placeholder="תשובה"><button class="btn" id="go" onclick="answer()">בדיקה</button></div>`}
function show(q){Q=q;tries=0;done=false;window.scrollTo(0,0);
 const rem=S.rem?`<div class="remb">🔁 תרגול חיזוק – שאלה דומה (צריך עוד ${S.rem.need} ${S.rem.need>1?'הצלחות':'הצלחה'})</div>`:'';
 app().innerHTML=`<div class="top"><span>${TOP[S.t].ic} ${TOP[S.t].name} · ${LV[S.l][0]}</span><span>${Math.min(S.n+1,PER)}/${PER} · ✔ ${S.score}</span></div><div class="bar"><i style="width:${S.n/PER*100}%"></i></div>
 <div class="card">${rem}<div class="qt">${q.txt}</div>${q.fig||''}<div class="hb"><button class="btn sec" onclick="openHelp('dec')">🔍 פענוח השאלה</button><button class="btn sec" onclick="openHelp('ex')">📖 דוגמה פתורה</button></div><div id="help"></div>${inputHTML(q)}<div id="fb"></div></div>`;
 document.querySelectorAll('.rat input,.num input').forEach((el,i,all)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){if(i<all.length-1)all[i+1].focus();else answer()}}));}
function readVal(){const f=id=>{const v=($('#'+id)||{}).value;return v==null||v.trim()===''?NaN:parseFloat(v.replace(',','.'))};return Q.kind==='ratio'?[f('a1'),f('a2')]:f('a1')}
function judge(q,v){// מחזיר {ok, msg}
 if(q.kind==='mc')return{ok:v===q.ans,msg:q.msgs[v]};
 if(q.kind==='num'){if(isNaN(v))return{empty:1};const ok=Math.abs(v-q.ans)<1e-9;return{ok,msg:ok?null:(q.err&&q.err(v))}}
 const[x,y]=v;if(isNaN(x)||isNaN(y))return{empty:1};const[a,b]=q.ans;const eq=x>0&&y>0&&x*b===y*a;
 if(eq&&q.exact&&!(x===a&&y===b))return{ok:false,msg:'נכון – אבל אפשר לצמצם עוד! חפשו מספר נוסף שמחלק את שני האיברים.'};
 return{ok:eq,msg:eq?null:(q.err&&q.err(x,y))}}
const solHTML=q=>`<div class="steps">${q.sol.map((s,i)=>`<div style="animation-delay:${i*.35}s"><span>${s[0]}</span><small>${s[1]}</small></div>`).join('')}</div>`;
function ansText(q){return q.kind==='mc'?q.opts[q.ans]:q.kind==='ratio'?RT(q.ans[0],q.ans[1]):M(q.ans)}
function answer(i){if(done)return;const v=Q.kind==='mc'?i:readVal(),r=judge(Q,v),fb=$('#fb');
 if(r.empty){fb.innerHTML='<div class="fb hi">כתבו תשובה ואז לחצו "בדיקה" 🙂</div>';return}
 if(r.ok){done=true;if(Q.kind==='mc')$('#o'+i).classList.add('good');lock();
  const first=tries===0;
  if(!S.rem){S.n++;if(first)S.score++;else S.rem={id:Q.id,need:1,count:0}}
  else{if(first)S.rem.need--;else S.rem.need=Math.max(S.rem.need,1)}
  const nextLbl=S.rem&&S.rem.need>0?'לשאלה דומה 💪':'הבא ←';
  fb.innerHTML=`<div class="fb ok"><b>${pick(['✔ נכון! כל הכבוד','✔ מצוין!','✔ בדיוק!','✔ יפה מאוד!'])}${hi()}</b>${!first?'<div>תיקנתם לבד – זה הכי חשוב! נעשה עוד שאלה דומה כדי לוודא.</div>':''}<div style="margin-top:6px;font-weight:600">מה עשינו?</div>${solHTML(Q)}</div><button class="btn ${S.rem&&S.rem.need>0?'rem':''}" onclick="nextQ()">${nextLbl}</button>`;
  return}
 tries++;if(Q.kind==='mc'){const b=$('#o'+i);b.classList.add('wrong');b.disabled=true}
 if(tries===1){fb.innerHTML=`<div class="fb hi">🤔 ${r.msg||'לא בדיוק.'}<div style="margin-top:4px">💡 רמז: ${Q.hint}</div><div style="margin-top:4px;font-weight:600">נסו שוב!</div></div>`;return}
 done=true;lock();S.lastDiag=Q.diag;
 if(!S.rem)S.n++;
 S.rem={id:Q.id,need:2,count:S.rem?S.rem.count:0,asked:S.rem?S.rem.asked:false};
 if(Q.kind==='mc')$('#o'+Q.ans).classList.add('good');
 fb.innerHTML=`<div class="fb no">${r.msg?r.msg+'<br>':''}התשובה הנכונה: ${ansText(Q)}<div style="margin-top:6px;font-weight:600">ככה פותרים:</div>${solHTML(Q)}${grpBlock(Q)}</div>
 <div class="diag">🔎 מה כנראה חסר לך: ${Q.diag}</div><div style="margin-top:6px;font-size:17px">עכשיו תקבלו שאלה דומה עם מספרים אחרים – תנסו לבד לפי הדרך שראיתם.</div>
 <button class="btn rem" onclick="nextQ()">לשאלה דומה 💪</button>`}
function lock(){document.querySelectorAll('#app input,#app .op,#go').forEach(e=>e.disabled=true)}
function levelEnd(){const{t,l}=S,score=G(S.score);if(DB.best[t+l]==null||score>DB.best[t+l])DB.best[t+l]=score;save();if(score>=70)burst();window.scrollTo(0,0);
 app().innerHTML=`<div class="card center"><div class="qt">סיימתם את רמה ${LV[l][0]}${hi()}! 🎉</div><div style="color:var(--mute)">הציון שלך</div><div class="big">${score}</div><div style="color:var(--mute)">${S.score} מתוך ${PER} נכונות בפעם הראשונה</div><div class="stars">${score===100?'🏆 ':''}${stars(score)||'💪'}</div>
 <div style="color:var(--mute)">${score===100?'מושלם! 100!':score>=70?'מוכנים לרמה הבאה!':'כדאי לתרגל את הרמה הזאת עוד פעם – כל פעם יש שאלות חדשות.'}</div>
 ${l<3?`<button class="btn" onclick="startLevel('${t}',${l+1})">לרמה ${LV[l+1][0]} ←</button>`:`<button class="btn" onclick="startTest('${t}')">📝 בחן את עצמך</button>`}
 <button class="btn sec" onclick="startLevel('${t}',${l})">שוב את אותה רמה</button><button class="btn sec" onclick="topic('${t}')">לתפריט ${TOP[t].name}</button></div>`}

// ---------- בחן את עצמך ----------
let TS=null;
function testMenu(){window.scrollTo(0,0);app().innerHTML=`<div class="card"><div class="qt">📝 בחן את עצמך</div><div style="color:var(--mute);font-size:17px">12 שאלות מכל רמות החשיבה, ⏱ בזמן שאתם בוחרים. אין רמזים ואין משוב בזמן המבחן – הכול מתגלה בסוף, עם הסבר לכל טעות.</div></div>
 <button class="btn lvl" onclick="startTest('r')"><span class="e">⚖️</span><span><b>יחס</b></span></button><button class="btn lvl" onclick="startTest('p')"><span class="e">📐</span><span><b>פיתגורס</b></span></button><button class="btn lvl" onclick="startTest('rp')"><span class="e">⚖️📐</span><span><b>שני הנושאים יחד</b></span></button>`}
function testTime(w){window.scrollTo(0,0);const nm=w==='rp'?'יחס + פיתגורס':TOP[w].name;
 app().innerHTML=`<div class="card"><div class="qt">⏱ כמה זמן אתם רוצים למבחן?</div><div style="color:var(--mute);font-size:17px">${nm} · 12 שאלות. בחרו זמן שמתאים לכם – אפשר לסיים גם לפני.</div></div>
 ${[[15,'⚡','מהיר','דקה ורבע לשאלה'],[24,'👍','רגיל (מומלץ)','2 דקות לשאלה'],[36,'🐢','רגוע','3 דקות לשאלה'],[0,'∞','בלי הגבלת זמן','רק סופרים כמה זמן לקח']].map(o=>`<button class="btn lvl" onclick="startTest('${w}',${o[0]})"><span class="e">${o[1]}</span><span><b>${o[0]?o[0]+' דקות – '+o[2]:o[2]}</b><small>${o[3]}</small></span></button>`).join('')}
 <button class="btn sec" onclick="testMenu()">→ חזרה</button>`}
function startTest(w,min){if(min===undefined)return testTime(w);const plan=[];const add=(t,l,n)=>{const ids=shuffle(TOP[t].L[l]);for(let i=0;i<n;i++)plan.push([t,l,ids[i%ids.length]])};
 if(w==='rp'){['r','p'].forEach(t=>{add(t,0,1);add(t,1,2);add(t,2,2);add(t,3,1)})}else{[0,1,2,3].forEach(l=>add(w,l,3))}
 plan.sort((x,y)=>x[1]-y[1]);TS={w,qs:plan.map(p=>gen(p[0],p[2],p[1])),i:0,ans:[],t0:Date.now()};TS.lim=min?min*60000:0;TS.warn=false;clearInterval(TT);TT=setInterval(tick,1000);tq()}
let TT=null;const mmss=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function tick(){if(!TS||!TS.lim){const c=$('#clock');if(c&&TS)c.textContent='⏱ '+mmss(Date.now()-TS.t0);return}const rem=TS.lim-(Date.now()-TS.t0),c=$('#clock');if(c){c.textContent='⏱ '+mmss(rem);c.style.color=rem<300000?'#b91c1c':''}
 if(rem<300000&&!TS.warn){TS.warn=true;toast('⏱ נשארו 5 דקות')}
 if(rem<=0){clearInterval(TT);while(TS.ans.length<TS.qs.length)TS.ans.push({ok:false,v:null,none:1});toast('⏱ הזמן נגמר');tEnd()}}
function tq(){const q=TS.qs[TS.i];Q=q;done=false;window.scrollTo(0,0);
 app().innerHTML=`<div class="top"><span>📝 בחן את עצמך · ${TOP[q.t].ic} ${LV[q.lv][0]}</span><span><b id="clock" class="m">⏱ ${mmss(TS.lim?TS.lim-(Date.now()-TS.t0):Date.now()-TS.t0)}</b> · ${TS.i+1}/${TS.qs.length}</span></div><div class="bar"><i style="width:${TS.i/TS.qs.length*100}%"></i></div>
 <div class="card"><div class="qt">${q.txt}</div>${q.fig||''}${inputHTML(q).replace(/onclick="answer\(/g,'onclick="tAnswer(').replace('>בדיקה<','>שמירה והמשך ←<')}<div id="fb"></div></div>`;
 document.querySelectorAll('.rat input,.num input').forEach((el,i,all)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){if(i<all.length-1)all[i+1].focus();else tAnswer()}}))}
function tAnswer(i){const q=TS.qs[TS.i],v=q.kind==='mc'?i:readVal(),r=judge(q,v);if(r.empty){$('#fb').innerHTML='<div class="fb hi">כתבו תשובה 🙂</div>';return}
 TS.ans.push({ok:!!r.ok,v});TS.i++;if(TS.i<TS.qs.length)tq();else tEnd()}
function tEnd(){clearInterval(TT);const n=TS.qs.length,sc=TS.ans.filter(a=>a.ok).length,min=Math.round((Date.now()-TS.t0)/60000),pct=Math.round(sc/n*100);
 const tl={};TS.qs.forEach((q,i)=>{const k=q.t+q.lv;tl[k]=tl[k]||{t:q.t,l:q.lv,ok:0,all:0};tl[k].all++;if(TS.ans[i].ok)tl[k].ok++});
 const rows=Object.values(tl).sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:a.l-b.l);const weak=rows.find(x=>x.ok<x.all);if(pct>=80)burst();window.scrollTo(0,0);
 const shown=v=>v==null?'':Array.isArray(v)?RT(v[0],v[1]):typeof v==='number'&&!isNaN(v)?M(v):'';
 app().innerHTML=`<div class="card center"><div class="qt">תוצאות המבחן${hi()}</div><div class="big">${pct}</div><div style="color:var(--mute)">${sc} מתוך ${n} נכונות · ⏱ ${M(Math.max(1,min))} דקות${TS.lim?' מתוך '+M(TS.lim/60000):''}</div>
 <table style="margin-top:10px"><tr><th>נושא</th><th>רמה</th><th>נכון</th></tr>${rows.map(x=>`<tr><td>${TOP[x.t].name}</td><td>${LV[x.l][0]}</td><td>${x.ok}/${x.all} ${x.ok===x.all?'✔':''}</td></tr>`).join('')}</table>
 ${weak?`<div class="diag" style="text-align:right">🎯 מומלץ לתרגל: <b>${TOP[weak.t].name} – רמה ${LV[weak.l][0]}</b></div><button class="btn" onclick="startLevel('${weak.t}',${weak.l})">לתרגל עכשיו ←</button>`:'<div class="fb ok">כל הכבוד! הכול נכון 🏆</div>'}</div>
 ${TS.qs.map((q,i)=>TS.ans[i].ok?'':`<div class="card"><div style="color:var(--bad);font-weight:600">✗ שאלה ${i+1} · ${LV[q.lv][0]}</div><div>${q.txt}</div>${q.fig||''}
 <div style="margin-top:6px">התשובה שלך: ${TS.ans[i].none?'לא הספקתם לענות':q.kind!=='mc'?shown(TS.ans[i].v):q.opts[TS.ans[i].v]}</div><div class="fb ok">התשובה הנכונה: ${ansText(q)}${solHTML(q)}</div><div class="diag">🔎 מה לחזק: ${q.diag}</div></div>`).join('')}
 <button class="btn sec" onclick="home()">🏠 לדף הבית</button>`}
home();
</script>
</body>
</html>
