<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משולש שווה שוקיים · כיתה ט׳</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mute:#6b7280;--acc:#4f46e5;--acc2:#eef2ff;--ok:#15803d;--okbg:#ecfdf5;--bad:#b91c1c;--badbg:#fef2f2;--hint:#92400e;--hintbg:#fffbeb;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:10px 14px 50px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
header h1{font-size:21px;margin:0}
.ib{min-width:48px;min-height:48px;border:0;background:var(--card);border-radius:12px;padding:8px 11px;font-size:18px;box-shadow:0 1px 3px #0001;cursor:pointer}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px #0000000d;margin:12px 0;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:19px;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff;font-weight:600;margin-top:10px}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn:active{transform:scale(.98)}
.lvl{display:flex;align-items:center;gap:12px;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:400}
.lvl .e{font-size:30px}
.lvl b{display:block;font-size:19px}
.lvl small{color:var(--mute);font-size:15px}
.lvl .sc{margin-inline-start:auto;font-weight:700;color:var(--acc);white-space:nowrap}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:16px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(270deg,#818cf8,#4f46e5);border-radius:9px;transition:width .4s;margin-inline-start:0}
.qt{font-size:20px;font-weight:600}
.opts{display:grid;gap:9px;margin-top:12px}
.op{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-size:18px;font-family:inherit;text-align:right;cursor:pointer;color:var(--ink)}
.op:disabled{opacity:.45}
.op.pick{border-color:var(--acc);background:var(--acc2);opacity:1}
.op.good{border-color:var(--ok);background:var(--okbg);opacity:1}
.op.wrong{border-color:var(--bad);background:var(--badbg);animation:sh .3s}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.num{display:flex;gap:8px;margin-top:12px}
.num input{min-height:52px;flex:1;font-size:22px;padding:10px;border:2px solid var(--line);border-radius:14px;text-align:center;font-family:inherit;direction:ltr;min-width:0}
.num .btn{width:auto;margin:0;padding:0 22px}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;animation:up .3s}
.fb.ok{background:var(--okbg);color:#064e3b}
.fb.hi{background:var(--hintbg);color:var(--hint)}
.fb.no{background:var(--badbg);color:#7f1d1d}
.fb .sol{color:var(--ink);margin-top:6px;font-size:17px}
.link{min-height:48px;background:none;border:0;color:var(--acc);text-decoration:underline;font-size:16px;font-family:inherit;cursor:pointer;padding:4px 0}
.fig{width:100%;max-width:340px;max-height:240px;display:block;margin:8px auto 0;direction:ltr}
.fig .pl{fill:#eef2ff;stroke:#334155;stroke-width:2.6;stroke-linejoin:round}
.fig .ln{stroke:#334155;stroke-width:2.6;stroke-linecap:round}
.fig .sg{stroke:#0891b2;stroke-width:2.6}
.fig .ex{stroke:#334155;stroke-width:2.2;stroke-dasharray:7 5}
.fig .tk{stroke:#334155;stroke-width:2.4}
.fig .mk,.fig .ar{fill:none;stroke:#e11d48;stroke-width:2}
.fig text{font-family:Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.fig .an{fill:#be123c;font-size:16em;font-weight:700}
.fig .sd{fill:#0f766e;font-size:16em;font-weight:700}
.fig .nm{fill:#111827;font-size:18em;font-weight:700}
.fig line,.fig polygon,.fig path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr .9s ease forwards}
.fig .ex{stroke-dasharray:7 5;stroke-dashoffset:0;animation:fd .5s forwards}
.fig text,.fig .tk,.fig .mk,.fig .ar{opacity:0;animation:fd .4s .7s forwards;stroke-dasharray:none;stroke-dashoffset:0}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fd{to{opacity:1}}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.row>div{flex:1;min-width:95px;text-align:center;font-size:15px;color:var(--mute)}
.row .fig{max-height:140px}
.did{background:#f0fdf4;border-inline-start:4px solid #22c55e;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:17px}
.did b{color:#15803d}
.steps div{opacity:0;animation:up .4s forwards;padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.steps small{color:#15803d;font-size:15px}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--acc);width:22px}
.nav{display:flex;gap:8px}.nav .btn{flex:1;padding:13px 6px;font-size:17px;white-space:nowrap}
.big{font-size:58px;font-weight:800;text-align:center;color:var(--acc);line-height:1.1}
.stars{text-align:center;font-size:34px;letter-spacing:4px}
.center{text-align:center}
table{width:100%;border-collapse:collapse;font-size:17px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.pill{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 12px;margin:3px;font-size:16px}
.name{width:100%;font-size:19px;padding:10px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.burst span{position:absolute;top:-30px;font-size:26px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(300deg);opacity:.2}}
footer{text-align:center;color:var(--mute);font-size:14px;margin-top:20px}
@media print{header .ib,.btn,.link,footer{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>📐 משולש שווה שוקיים</h1><div style="font-size:14px;color:var(--mute)">שחקים · ערכה: רוני מודן</div></div><div><button class="ib" onclick="go('home')" title="בית">🏠</button> <button class="ib" onclick="fs()" title="מסך מלא">⛶</button></div></header>
<main id="app"></main>
<footer>ערכה: רוני מודן · שחקים · כיתה ט׳</footer>
</div>
<div class="burst" id="burst"></div>
<script>
// ---------- כלים ----------
const $=s=>document.querySelector(s);
const ri=(a,b,s=1)=>a+s*Math.floor(Math.random()*(Math.floor((b-a)/s)+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const M=s=>`<span class="m">${s}</span>`;
const dg=n=>M(n+'°');
function ex(k,c,v='x'){let s=k===0?'':(k===1?v:k+v);if(c){s=s?s+(c>0?' + '+c:' − '+(-c)):String(c)}return s||'0'}
function mc(right,wrongs){const o=shuffle([{h:right,r:1},...wrongs.map(h=>({h,r:0}))]);return{type:'mc',opts:o.map(x=>x.h),ans:o.findIndex(x=>x.r)}}
// גאומטריה
const V=(a,b)=>[b[0]-a[0],b[1]-a[1]],Ln=v=>Math.hypot(v[0],v[1]),N=v=>{const l=Ln(v)||1;return[v[0]/l,v[1]/l]},add=(a,v,k=1)=>[a[0]+v[0]*k,a[1]+v[1]*k],mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const R=Math.PI/180;
function isoP(apex=60,n=['A','B','C']){const a=Math.min(150,Math.max(36,apex)),h=120/Math.tan(a*R/2);return{[n[0]]:[120,200-h],[n[1]]:[0,200],[n[2]]:[240,200]}}
function angP(b,c,n=['A','B','C']){const AB=240*Math.sin(c*R)/Math.sin((b+c)*R);return{[n[0]]:[AB*Math.cos(b*R),200-AB*Math.sin(b*R)],[n[1]]:[0,200],[n[2]]:[240,200]}}
function sideP(ab,ac,bc){const k=240/bc;ab*=k;ac*=k;const x=(ab*ab-ac*ac+240*240)/480,y=Math.sqrt(Math.max(0,ab*ab-x*x));return{A:[x,200-y],B:[0,200],C:[240,200]}}
function lineP(t){const O=[150,150];return{L:[10,150],R:[290,150],O,X:add(O,[Math.cos(t*R),-Math.sin(t*R)],115)}}
function fig(P,o={}){
 const ks=Object.keys(P),pts=ks.map(k=>P[k]),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),K=Math.max(1,(Math.max(...xs)-Math.min(...xs))/300,(Math.max(...ys)-Math.min(...ys))/230),pad=(o.pad||38)*K;
 const x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad,w=Math.max(...xs)-Math.min(...xs)+2*pad,h=Math.max(...ys)-Math.min(...ys)+2*pad;
 const cp=o.poly||ks,cen=[cp.reduce((s,k)=>s+P[k][0],0)/cp.length,cp.reduce((s,k)=>s+P[k][1],0)/cp.length];
 const f=n=>n.toFixed(1);let g='';
 if(o.poly)g+=`<polygon class="pl" points="${o.poly.map(k=>P[k].map(f).join(',')).join(' ')}"/>`;
 for(const[a,b,c]of(o.segs||[]))g+=`<line class="${c||'sg'}" x1="${f(P[a][0])}" y1="${f(P[a][1])}" x2="${f(P[b][0])}" y2="${f(P[b][1])}"/>`;
 for(const[v,a,b]of(o.right||[])){const u1=N(V(P[v],P[a])),u2=N(V(P[v],P[b])),s=13*K,p1=add(P[v],u1,s),p2=add(p1,u2,s),p3=add(P[v],u2,s);g+=`<path class="mk" d="M${f(p1[0])} ${f(p1[1])}L${f(p2[0])} ${f(p2[1])}L${f(p3[0])} ${f(p3[1])}"/>`}
 for(const[v,a,b,cnt]of(o.arcs||[])){const u1=N(V(P[v],P[a])),u2=N(V(P[v],P[b])),sw=(u1[0]*u2[1]-u1[1]*u2[0])>0?1:0;for(let i=0;i<(cnt||1);i++){const r=(22+i*5)*K,s=add(P[v],u1,r),e=add(P[v],u2,r);g+=`<path class="ar" d="M${f(s[0])} ${f(s[1])}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 ${sw} ${f(e[0])} ${f(e[1])}"/>`}}
 for(const[a,b,cnt]of(o.ticks||[])){const d=N(V(P[a],P[b])),n=[-d[1],d[0]],m=mid(P[a],P[b]);for(let i=0;i<cnt;i++){const c=add(m,d,(i-(cnt-1)/2)*7*K),p=add(c,n,8*K),q=add(c,n,-8*K);g+=`<line class="tk" x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}"/>`}}
 for(const[a,b,t]of(o.sides||[])){const d=N(V(P[a],P[b]));let n=[-d[1],d[0]];const m=mid(P[a],P[b]);if((m[0]-cen[0])*n[0]+(m[1]-cen[1])*n[1]<0)n=[-n[0],-n[1]];const p=add(m,n,(18+String(t).length*4*Math.abs(n[0]))*K);g+=`<text class="sd" x="${f(p[0])}" y="${f(p[1])}">${t}</text>`}
 for(const[v,a,b,t,dl]of(o.ang||[])){const u1=N(V(P[v],P[a])),u2=N(V(P[v],P[b])),bis=N(add(u1,u2)),th=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));const r=(Math.min(80,Math.max(32,19/Math.sin(th/2)))+String(t).length*2.6)*K,p=add(P[v],bis,r);g+=`<text class="an" x="${f(p[0])}" y="${f(p[1])}"${dl?` style="animation-delay:${dl}s"`:''}>${t}</text>`}
 for(const k of(o.names===undefined?ks:o.names)){const d=N(V(cen,P[k])),p=add(P[k],d,17*K);g+=`<text class="nm" x="${f(p[0])}" y="${f(p[1])}">${k}</text>`}
 return `<svg class="fig" style="font-size:${K}px" viewBox="${f(x0)} ${f(y0)} ${f(w)} ${f(h)}">${g}</svg>`}
const TRI=['A','B','C'],legs=(t=TRI)=>[[t[0],t[1],1],[t[0],t[2],1]];
const SETS=[['A','B','C'],['K','L','M'],['P','Q','R'],['S','T','U']];

// ---------- נושאים ורמזים ----------
const T={
 sum:{n:'סכום הזוויות במשולש',h:'סכום שלוש הזוויות בכל משולש הוא '+dg(180)+'.',c:0},
 adj:{n:'זוויות צמודות',h:'זוויות צמודות (יחד הן קו ישר) – סכומן '+dg(180)+'.',c:1},
 iso:{n:'שוקיים, בסיס וזוויות בסיס',h:'במשולש שווה שוקיים שתי השוקיים שוות, וזוויות הבסיס שוות זו לזו.',c:2},
 ident:{n:'זיהוי משולש שווה שוקיים',h:'משולש הוא שווה שוקיים אם יש בו שתי צלעות שוות – או שתי זוויות שוות.',c:3},
 seg:{n:'תיכון, גובה, חוצה זווית',h:'תיכון – מגיע לאמצע הצלע. גובה – יוצר זווית של '+dg(90)+'. חוצה זווית – מחלק זווית לשני חלקים שווים.',c:4},
 three:{n:'שלושה באחד: תיכון = גובה = חוצה זווית',h:'במשולש שווה שוקיים, הקטע מזווית הראש אל הבסיס הוא גם תיכון, גם גובה וגם חוצה זווית.',c:5},
 eq:{n:'משוואות עם זוויות וצלעות',h:'כותבים משוואה: מחברים את הזוויות ומשווים ל-'+dg(180)+', או משווים שתי צלעות שוות. ואז פותרים.',c:6},
 think:{n:'חשיבה והסקה',h:'עצרו ובדקו כל אפשרות: האם כל הזוויות חיוביות? האם הסכום '+dg(180)+'?',c:2}
};

// ---------- רמה 1: ידע וזיהוי ----------
const triOK=s=>s[0]<s[1]+s[2]&&s[1]<s[0]+s[2]&&s[2]<s[0]+s[1];
let factPool=[];
const FACTS=[
 {q:'סכום הזוויות בכל משולש הוא:',r:dg(180),w:[dg(90),dg(360),dg(270)],tag:'sum',s:'בכל משולש, בלי יוצא מן הכלל, סכום הזוויות הוא '+dg(180)+'.'},
 {q:'שתי זוויות צמודות (יחד הן קו ישר) – סכומן:',r:dg(180),w:[dg(90),dg(360),dg(100)],tag:'adj',s:'קו ישר הוא חצי סיבוב: '+dg(180)+'.'},
 {q:'במשולש שווה שוקיים – אילו זוויות שוות?',r:'שתי זוויות הבסיס',w:['זווית הראש וזווית בסיס','כל שלוש הזוויות, תמיד','אף זווית לא שווה'],tag:'iso',s:'הזוויות שליד הבסיס (מול השוקיים) שוות זו לזו.'},
 {q:'קטע שיוצא מקודקוד אל אמצע הצלע שמולו נקרא:',r:'תיכון',w:['גובה','חוצה זווית','בסיס'],tag:'seg',s:'תיכון = מגיע ל<b>אמצע</b> הצלע.'},
 {q:'גובה במשולש יוצר עם הצלע שמולו זווית של:',r:dg(90),w:[dg(180),dg(45),dg(60)],tag:'seg',s:'גובה תמיד מאונך לצלע: '+dg(90)+'.'},
 {q:'במשולש שווה צלעות, כל זווית היא:',r:dg(60),w:[dg(90),dg(45),dg(180)],tag:'ident',s:'שלוש זוויות שוות: 180 : 3 = 60.'}];
const L1=[
 ()=>{const yes=Math.random()<.55;let s;if(yes){const a=ri(4,9);let b;do{b=ri(3,12)}while(b===a||b>=2*a);s=shuffle([a,a,b])}else{do{s=[ri(3,10),ri(3,10),ri(3,10)]}while(new Set(s).size<3||!triOK(s))}
  return{tag:'ident',k:s.join(','),q:'האם המשולש שווה שוקיים?',fig:fig(sideP(s[0],s[1],s[2]),{poly:TRI,sides:[['A','B',s[0]],['A','C',s[1]],['B','C',s[2]]]}),...mc(yes?'כן':'לא',[yes?'לא':'כן']),
  sol:yes?'יש בו שתי צלעות שוות (שני מספרים זהים) – לכן הוא שווה שוקיים.':'כל שלוש הצלעות שונות זו מזו – לכן הוא <b>לא</b> שווה שוקיים.'}},
 ()=>{const t=pick(SETS),i=ri(0,2),ap=t[i],o=t.filter(x=>x!==ap),ask=pick(['b','a','ba']);const F=fig(isoP(ri(40,100,10),[ap,o[0],o[1]]),{poly:[ap,o[0],o[1]],ticks:[[ap,o[0],1],[ap,o[1],1]]});
  const A=x=>M('∠'+x);
  if(ask==='b')return{tag:'iso',k:ap+ask,q:'הקווים הקטנים מסמנים צלעות שוות. מהו <b>הבסיס</b>?',fig:F,...mc(M(o[0]+o[1]),[M(ap+o[0]),M(ap+o[1])]),sol:'השוקיים מסומנות. הבסיס הוא הצלע השלישית: '+M(o[0]+o[1])+'.'};
  if(ask==='a')return{tag:'iso',k:ap+ask,q:'מהי <b>זווית הראש</b>?',fig:F,...mc(A(ap),[A(o[0]),A(o[1])]),sol:'זווית הראש נמצאת בין שתי השוקיים: '+A(ap)+'.'};
  return{tag:'iso',k:ap+ask,q:'מהן <b>זוויות הבסיס</b>?',fig:F,...mc(A(o[0])+' ו-'+A(o[1]),[A(ap)+' ו-'+A(o[0]),A(ap)+' ו-'+A(o[1])]),sol:'זוויות הבסיס יושבות על הבסיס '+M(o[0]+o[1])+': '+A(o[0])+' ו-'+A(o[1])+'.'}},
 ()=>{if(!factPool.length)factPool=shuffle(FACTS);const F=factPool.pop();return{tag:F.tag,k:F.q,q:F.q,...mc(F.r,F.w),sol:F.s}},
 ()=>{let b,c,a;do{b=ri(30,80,10);c=ri(30,80,10);a=180-b-c}while(a<20);
  return{tag:'sum',k:b+','+c,q:'מצאו את '+M('∠A')+' (במעלות).',fig:fig(angP(b,c),{poly:TRI,ang:[['B','A','C',b+'°'],['C','A','B',c+'°'],['A','B','C','?']]}),type:'num',ans:a,sol:M(`180 − ${b} − ${c} = ${a}`)+' &nbsp;לכן '+M('∠A = '+a+'°')}},
 ()=>{const b=ri(35,80,5),g=pick(['B','C']),o=g==='B'?'C':'B';
  return{tag:'iso',k:b+g,q:M('AB = AC')+'. מצאו את '+M('∠'+o)+'.',fig:fig(isoP(180-2*b),{poly:TRI,ticks:legs(),ang:[[g,'A',o,b+'°'],[o,'A',g,'?']]}),type:'num',ans:b,sol:'זוויות הבסיס שוות: '+M(`∠${o} = ∠${g} = ${b}°`)}},
 ()=>{const t=ri(30,150,5);if(t===90)return L1[5]();const giveR=Math.random()<.5,P=lineP(t);

 <button class="btn ${L<3&&sc>=70?'sec':''}" onclick="go('play',${L})">↻ שוב את רמה ${L+1} (שאלות חדשות)</button>

function report(){const tl=thinkLevel(),miss=[...new Set(DB.miss.flat())],d=new Date().toLocaleDateString('he-IL');
 app().innerHTML=`<div class="card"><div class="qt">📊 הציון שלי – משולש שווה שוקיים</div><div style="color:var(--mute);font-size:15px">שחקים · ערכה: רוני מודן</div>
 <input class="name" placeholder="השם שלי" value="${(DB.name||'').replace(/"/g,'')}" oninput="DB.name=this.value;save()"><div style="color:var(--mute);font-size:15px;margin:6px 0">${d}</div>
 <table><tr><th>רמה</th><th>הכי טוב</th><th>אחרון</th></tr>${LV.map((l,i)=>`<tr><td>${l.e} ${i+1}. ${l.n}</td><td><b>${DB.best[i]??'–'}</b> ${stars(DB.best[i])}</td><td>${DB.last[i]??'–'}</td></tr>`).join('')}</table>
 ${DB.exam?`<p><b>📝 בחן את עצמך:</b> הכי טוב ${DB.exam.best} · אחרון ${DB.exam.last}${DB.exam.lastTl>=0?' · רמה '+(DB.exam.lastTl+1):''}</p>`:''}
 <div class="did" style="margin-top:14px"><b>רמת החשיבה שלי:</b> ${tl>=0?LV[tl].e+' רמה '+(tl+1)+' – '+LV[tl].n:'🌱 בדרך לרמה 1 – התחילו מהשיעור הקצר!'}</div>
 ${miss.length?`<p><b>נושאים לחזק:</b><br>${miss.map(t=>`<span class="pill">${T[t].n}</span>`).join('')}</p>`:''}
 <p style="font-size:15px;color:var(--mute)">עוברים רמה בציון 70 ומעלה. נכון בניסיון ראשון = נקודה, בשני = חצי.</p>
 <div class="did">📸 רוצים להראות למורה? צלמו מסך של הכרטיס הזה ושלחו לה.</div>
 <button class="btn sec" id="rst" onclick="if(this.dataset.ok){DB={best:[null,null,null,null],last:[null,null,null,null],miss:[[],[],[],[]],name:DB.name,exam:null};save();go('report')}else{this.dataset.ok=1;this.textContent='לחצו שוב כדי למחוק את כל הציונים'}">איפוס ציונים</button></div>`}
go('home');
</script>
